<mat-toolbar color="primary">
    <span class="title-center">Porudzbina</span>
  </mat-toolbar>
  
  <div class="container mat-elavation-z8">
    <table mat-table [dataSource]="dataSource" class="mat-cell">
      <!-- ID -->
      <ng-container matColumnDef="id">
        <th mat-header-cell *matHeaderCellDef>ID</th>
        <td mat-cell *matCellDef="let row">{{ row.id }}</td>
      </ng-container>
  
     
      <ng-container matColumnDef="datumPorudzbine">
        <th mat-header-cell *matHeaderCellDef>Datum Porudzbine</th>
        <td mat-cell *matCellDef="let row">{{ row.datumPorudzbine | date: "dd.MM.yyyy." }}</td>
      </ng-container>
  
      
      <ng-container matColumnDef="datumIsporuke">
        <th mat-header-cell *matHeaderCellDef>Datum Isporuke</th>
        <td mat-cell *matCellDef="let row">{{ row.datumIsporuke | date: "dd.MM.yyyy." }}</td>
      </ng-container>

      <ng-container matColumnDef="iznos">
        <th mat-header-cell *matHeaderCellDef>Iznos</th>
        <td mat-cell *matCellDef="let row">{{ row.iznos }}</td>
      </ng-container>

      <ng-container matColumnDef="placeno">
        <th mat-header-cell *matHeaderCellDef>Placeno</th>
        <td mat-cell *matCellDef="let row">{{ row.placeno }}</td>
      </ng-container>

      <ng-container matColumnDef="dobavljac">
        <th mat-header-cell *matHeaderCellDef>Dobavljac</th>
        <td mat-cell *matCellDef="let row">{{ row.dobavljac.naziv }}</td>
      </ng-container>
  
      <!-- Action Buttons -->
      <ng-container matColumnDef="actions">
        <th mat-header-cell *matHeaderCellDef>
          <button mat-icon-button (click)="openDialog(1)">
            <mat-icon color="accent">add</mat-icon>
          </button>
        </th>
        <td mat-cell *matCellDef="let row; let i = index">
          <button mat-icon-button (click)="openDialog(2,row.id, row.datumPorudzbine, row.datumIsporuke, row.iznos, row.placeno, row.dobavljac)">
            <mat-icon color="primary" aria-label="Edit">edit</mat-icon>
          </button>
          <button mat-icon-button (click)="openDialog(3,row.id, row.datumPorudzbine, row.datumIsporuke, row.iznos, row.placeno, row.dobavljac)">
            <mat-icon color="warn" aria-label="Delete">delete</mat-icon>
          </button>
        </td>
      </ng-container>
  
      <!-- Rows -->
      <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
      <tr mat-row *matRowDef="let row; columns: displayedColumns" (click)="selectRow(row)"></tr>
    </table>
  </div>
  
  @if(parentSelectedPorudzbina){
    <app-stavka-porudzbine [childSelectedPorudzbina]="parentSelectedPorudzbina"></app-stavka-porudzbine>
  }
